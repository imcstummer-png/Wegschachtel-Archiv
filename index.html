<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wegschachtel Archiv</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="home-header">

    <p class="home-eyebrow">
        PERSONAL PHOTO ARCHIVE · EST. 2026
    </p>

    <div class="ornament-row top-ornament">
        
    </div>

    <div class="manuscript-title">

        <h1>
            <span class="title-line">
                <span class="illuminated-letter">W</span>
                <span class="title-rest">egschachtel</span>
            </span>

            <span class="title-archive">
                Archiv
            </span>
        </h1>

    </div>

    <div class="ornament-row bottom-ornament">
        
    </div>

    <p class="home-subtitle">
        Eine Sammlung unserer Erinnerungen.
    </p>

</header>

    <main>

        <section>
            <h2>Jahre</h2>

           <div id="year-grid" class="year-grid"></div>
        </section>

        <section class="random-section">

    <p class="archive-label">
        DON'T KNOW WHERE TO START?
    </p>

    <button
        id="random-memory"
        class="random-memory-button"
        type="button">
        RANDOM MEMORY →
    </button>

</section>

<section class="random-photo-section">

    <div class="random-photo-heading">

        <p class="archive-label">
            FROM THE ARCHIVE
        </p>

        <span id="random-photo-number"></span>

    </div>


    <a
        id="random-photo-link"
        class="random-photo-link"
        href="#"
    >

        <div class="random-photo-frame">

            <img
                id="random-photo"
                src=""
                alt="Zufällige Erinnerung"
            >

        </div>


        <div class="random-photo-info">

            <span id="random-photo-event"></span>

            <span>
                VIEW MEMORY →
            </span>

        </div>

    </a>

</section>

       <section class="memory-section">

    <p class="archive-label">
        MEMORY ARCHIVE
    </p>

    <h2 class="memory-heading">
        Rückblicke
    </h2>

    <div class="memory-card">
        <h3>Heute vor einem Jahr</h3>

        <p>
            Erinnerungen vom gleichen Tag im letzten Jahr.
        </p>
    </div>

</section>

    </main>

<script src="data/events.js"></script>
<script src="home.js"></script>

</body>
</html>
