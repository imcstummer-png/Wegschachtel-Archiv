<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Wegschachtel Archiv</title>

    <link rel="stylesheet" href="../style.css">
</head>


<body class="event-page">

    <nav class="archive-nav">

        <a href="../index.html">
            WEGSCHACHTEL
        </a>

        <div>
            <a id="nav-year" href="#">
                YEAR
            </a>

            <span>/</span>

            <span id="nav-event">
                EVENT
            </span>
        </div>

    </nav>


    <header class="event-header">

        <div
            id="event-number"
            class="event-number">
            FILE
        </div>

        <h1 id="event-title">
            Event
        </h1>

        <div class="event-details">

            <span id="event-date"></span>

            <span id="event-location"></span>

        </div>

        <p
            id="event-description"
            class="event-intro">
        </p>


        <div class="archive-divider">

            <span>
                PHOTO ARCHIVE
            </span>

            <span id="photo-count">
                000
            </span>

        </div>

    </header>


    <main class="event-content">

        <div
            id="photo-archive"
            class="photo-archive">
        </div>

    </main>


    <footer class="archive-footer">

        <p id="footer-title">
            WEGSCHACHTEL ARCHIVE
        </p>

        <a id="back-to-year" href="#">
            ← BACK
        </a>

    </footer>


    <script src="../event.js"></script>

</body>

</html>
